[package]
name = "shader-slang-sys"
version = "0.1.0"
edition = "2021"
authors = ["Slang Rust Bindings Contributors"]
license = "MIT OR Apache-2.0"
description = "Raw FFI bindings to the Slang shading language compiler (shader-slang/slang)"
repository = "https://github.com/yourusername/shader-slang-rs"
keywords = ["slang", "shader", "compiler", "graphics", "gpu"]
categories = ["external-ffi-bindings", "graphics"]
rust-version = "1.70"
build = "build.rs"
links = "slang"

[dependencies]
libc = "0.2"

[build-dependencies]
bindgen = "0.69"
cc = "1.0"
ureq = { version = "2", default-features = false, features = ["tls"] }
sha2 = "0.10"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
dirs = "5"

[features]
default = ["prebuilt"]
# Download official prebuilt Slang binaries and link dynamically.
prebuilt = []
# Build Slang from source (git submodule) via CMake; allows static linking.
build-from-source = []
static-link = []
dynamic-link = []
