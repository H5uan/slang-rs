[package]
name = "shader-slang"
version = "0.1.0"
edition = "2021"
authors = ["Slang Rust Bindings Contributors"]
license = "MIT OR Apache-2.0"
description = "Safe, idiomatic Rust bindings for the Slang shading language compiler"
repository = "https://github.com/yourusername/shader-slang-rs"
keywords = ["slang", "shader", "compiler", "graphics", "gpu"]
categories = ["graphics", "compilers", "external-ffi-bindings"]
rust-version = "1.70"

[dependencies]
libc = "0.2"
shader-slang-sys = { path = "shader-slang-sys" }

[lib]
name = "shader_slang"
crate-type = ["lib", "staticlib", "cdylib"]

[features]
default = ["prebuilt"]
prebuilt = ["shader-slang-sys/prebuilt"]
build-from-source = ["shader-slang-sys/build-from-source"]
static-link = ["shader-slang-sys/static-link"]
dynamic-link = ["shader-slang-sys/dynamic-link"]

[workspace]
members = [".", "shader-slang-sys"]

[profile.release]
opt-level = 3
lto = true

[profile.dev]
opt-level = 0
debug = true
