[package]
name = "shader-slang-rs"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Rust bindings for the Slang shader language compiler"
license = "MIT OR Apache-2.0"
repository = "https://github.com/H5uan/slang-rs"
readme = "README.md"
keywords = ["slang", "shader", "spirv", "hlsl", "compiler"]
categories = ["compilers", "api-bindings"]
# The slang/ submodule is only needed for the `source-build` feature in a
# development checkout; the published package falls back to the prebuilt
# release archive's headers.
exclude = ["slang/", "target/", "AGENTS.md"]

[dependencies]
shader-slang-rs-sys = { path = "shader-slang-rs-sys", version = "0.2.0" }

[features]
serde = ["shader-slang-rs-sys/serde"]
source-build = ["shader-slang-rs-sys/source-build"]

[workspace]
members = ["shader-slang-rs-sys"]
