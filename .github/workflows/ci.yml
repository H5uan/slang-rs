name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon (aarch64), so the matrix covers
        # windows-x86_64, linux-x86_64 and macos-aarch64.
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # No `submodules: recursive` here on purpose: the tests do not need the
      # slang/ submodule. Without the `source-build` feature, build.rs
      # downloads the official prebuilt Slang v2026.14.1 release and falls
      # back to the archive's include/ directory for slang.h. The submodule
      # is only needed for `--features source-build` (cmake build).
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

      # cargo test performs a real download of the official prebuilt Slang
      # binaries on Linux/macOS and compiles shaders against them; this is
      # the verification path for the Linux/macOS branches of
      # shader-slang-rs-sys/build.rs, which are written against the release
      # artifacts but cannot be exercised on the Windows dev machine.
      #
      # `--test-threads=1` avoids a flaky SIGBUS on the macOS CI runner
      # (signal 10, access to undefined memory) when Slang's internal global
      # state is accessed concurrently from multiple tests.
      - run: cargo test --workspace -- --test-threads=1
