[package]
name = "shader-slang-rs-sys"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "FFI bindings for the Slang shader language compiler"
license = "MIT OR Apache-2.0"
repository = "https://github.com/H5uan/slang-rs"
readme = "README.md"
keywords = ["slang", "shader", "ffi", "bindings", "compiler"]
categories = ["compilers", "external-ffi-bindings"]
links = "slang"

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[build-dependencies]
bindgen = "0.72.0"

[features]
serde = ["dep:serde"]
source-build = []
